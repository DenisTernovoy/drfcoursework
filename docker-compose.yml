services:
  db:
    image: postgres:15.1-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "pg_isready -U ${DB_USER} -d ${DB_NAME}"
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8.0-alpine
    env_file:
      - .env
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: "redis-cli ping"
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    image: denistern/drfcoursework
    command: >
      bash -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    environment:
      DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://158.160.209.235:80;http://0.0.0.0:5432
      CSRF_TRUSTED_ORIGINS: http://158.160.209.235:80;http://0.0.0.0:5432
      BASE_SERVER_URL: http://158.160.209.235:80
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_volume:/drf/media

  static_collector:
    image: denistern/drfcoursework
    command: bash -c "python manage.py collectstatic -c --no-input"
    env_file: .env
    volumes:
      - static_volume:/drf/static
    depends_on:
      backend:
        condition: service_started

  web:
    build:
      context: ./nginx
    ports:
      - "80:80"
    depends_on:
      static_collector:
        condition: service_completed_successfully
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/drf/static
      - media_volume:/drf/media

  celery:
    image: denistern/drfcoursework
    command: celery -A config worker -l INFO -P eventlet
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      backend:
         condition: service_started
  beat:
    image: denistern/drfcoursework
    command: celery -A config beat -l info -S django
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      celery:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume: